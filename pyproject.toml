[project]
name = "fixagent"
version = "0.1.0"
description = "An AI agent that fixes a website's robots.txt, llms.txt and Organization schema by pull request, with every tool call checked against a Tenuo warrant on Temporal."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "pyyaml>=6",
    "python-dotenv>=1",
    "anthropic>=0.40",
    "tenuo[temporal]>=0.3.1",
]

[project.scripts]
fixagent = "fixagent.cli:app"

[dependency-groups]
dev = ["pytest>=8", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fixagent"]
